name: Build installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            bundle: nsis
          - platform: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            bundle: dmg
          - platform: macos-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            bundle: dmg
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: installers-${{ matrix.target }}
          cache-on-failure: true
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Check frontend, translations and lifecycle regressions
        shell: bash
        run: |
          set -euo pipefail
          pnpm lint
          node scripts/check-i18n.mjs
          node --experimental-vm-modules --test scripts/a1-regression.test.mjs scripts/test-updates.mjs
          node scripts/test-window-flows.mjs
          node scripts/test-command-freeze.mjs
          node scripts/test-tab-transfers.mjs
          node scripts/test-tab-merging.mjs
          node scripts/test-tab-drop.mjs
          node --test scripts/prepare-release-artifact.test.mjs
      - name: Build native installer
        # Tauri merges tauri.macos.conf.json and enables its managed Cargo features.
        run: pnpm tauri build --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundle }} -- --locked
      - name: Run native Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}
      - name: Verify packaged macOS app and smoke-test startup
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          image=$(find src-tauri/target/${{ matrix.target }}/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)
          test -n "$image"
          # macOS /var is a symlink to /private/var. Tauri intentionally rejects
          # executable paths containing symlinks, so launch from the physical path.
          mount_dir=$(cd "$(mktemp -d)" && pwd -P)
          test_home=$(cd "$(mktemp -d)" && pwd -P)
          app_pid=''
          cleanup() {
            if [ -n "$app_pid" ]; then kill "$app_pid" 2>/dev/null || true; wait "$app_pid" 2>/dev/null || true; fi
            hdiutil detach "$mount_dir" -quiet || true
          }
          trap cleanup EXIT
          hdiutil verify "$image"
          hdiutil attach "$image" -readonly -nobrowse -mountpoint "$mount_dir"
          codesign --verify --deep --strict --verbose=2 "$mount_dir/Boshu.app"
          HOME="$test_home" "$mount_dir/Boshu.app/Contents/MacOS/boshu" > "$RUNNER_TEMP/boshu-startup.log" 2>&1 &
          app_pid=$!
          sleep 5
          if ! kill -0 "$app_pid" 2>/dev/null; then
            cat "$RUNNER_TEMP/boshu-startup.log"
            echo 'The packaged application exited unexpectedly during startup.'
            exit 1
          fi
          cat "$RUNNER_TEMP/boshu-startup.log"
          echo 'Packaged macOS application remained running with an isolated HOME.'
      - name: Prepare installer and checksum
        run: node scripts/prepare-release-artifact.mjs ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: silk-book-${{ matrix.platform }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 30

  checksums:
    name: Combined checksums
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: silk-book-*
          path: release-artifacts
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify installers and combine checksums
        run: node scripts/prepare-release-artifact.mjs checksums
      - uses: actions/upload-artifact@v4
        with:
          name: silk-book-installers
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 30
