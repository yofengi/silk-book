[package]
name = "boshu"
version = "0.2.0"
edition = "2021"
build = "build.rs"

[lib]
name = "boshu_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "=2.7.0", features = [] }

[dependencies]
tauri = { version = "=2.12.0", features = ["protocol-asset"] }
tauri-plugin-dialog = "=2.8.0"
tauri-plugin-opener = "=2.6.0"
tauri-plugin-single-instance = "=2.4.0"
tauri-plugin-updater = { version = "=2.13.1", default-features = false, features = ["rustls-tls", "system-proxy"] }
minisign-verify = "=0.2.5"
base64 = "=0.22.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.21"
encoding_rs = "=0.8.35"
chardetng = "=0.1.17"
tempfile = "=3.27.0"
percent-encoding = "=2.3.2"
dunce = "=1.0.5"
uuid = { version = "=1.26.1", features = ["v4"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "system-proxy"] }
semver = "=1.0.28"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_Security", "Win32_Graphics_DirectWrite", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Globalization", "Win32_System_Com"] }
